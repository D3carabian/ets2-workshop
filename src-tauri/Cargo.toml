[package]
name = "ets2-workshop"
version = "0.4.0"
license = "MIT"
edition = "2021"
default-run = "ets2-workshop"

[lib]
name = "workshop_core"
path = "src/lib.rs"

[[bin]]
name = "ets2-workshop"
path = "src/main.rs"

[[bin]]
name = "workshop-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "workshop-launcher"
path = "src/bin/launcher.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
decrypt_truck = { path = "vendor/decrypt-truck" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.55"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
directories = "6"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
